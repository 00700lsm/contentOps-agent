services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: contentops
      POSTGRES_USER: contentops
      POSTGRES_PASSWORD: contentops
    ports:
      - "5432:5432"
    volumes:
      - contentops-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contentops -d contentops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  contentops-pgdata:
